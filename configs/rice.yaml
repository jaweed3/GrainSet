# full rice dataset configuration for training & benchmark

NAME: 'grain'
COMMENT: 'grain rice full dataset benchmark'
AUTHOR: 'fatih'

CHECKPOINTS: "./runs/checkpoints/"
LOG_PATH: "./runs/logs/"
SAVE_ONNX_PATH: "./runs/onnx/"

DATASET:
  PATH: '/home/master_core_ti/skripsi-grain/datasets/rice'
  NAME: 'rice_full'
  WORKERS: 4

RESUME:
  FLAG: False

AUGMENT:
  MIXUP_RATIO: 0
  RandBright_limit: 0.15 
  RandBright_ratio: 0.3 
  RandContra_limit: 0.15
  RandContra_ratio: 0.3

MODEL:
  NAME: 'seresnet50'

OPTIM:
  NAME: 'adam'
  INIT_LR: 1.2e-3
  LR_SCHEDULER: 'step'
  LOSS: 'CrossEntropy'

TRAIN:
  BATCH: 64
  EPOCHS: 50
  START_EPOCH: 0
  SIZE: (224,224)

TEST:  
  BATCH: 64
  SIZE: (224,224)
